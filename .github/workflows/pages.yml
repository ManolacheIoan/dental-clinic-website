name: Pages

# Checks every push to main and every pull request (lint, types, Playwright + axe tests).
# Only pushes to main publish the site to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Build for tests (served from the root)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright + axe tests
        run: npm test
        env:
          CI: "true"

      - name: Build for /dental-clinic-website/
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run clean && npm run build
        env:
          BASE_PATH: /dental-clinic-website
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
